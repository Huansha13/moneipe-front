<mat-sidenav-container class="h-100">
  <mat-sidenav
    [mode]="responsive.isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (closedStart)="sidenavOpened.set(false)"
    class="app-sidenav d-flex flex-column"
  >
    <div class="d-flex flex-column h-100">
      <mat-toolbar class="position-sticky top-0 border-bottom z-1">
        <div class="d-flex align-items-center gap-3">
          <div class="avatar rounded-1 p-2 d-flex align-items-center justify-content-center fs-xs fw-bold flex-shrink-0">A</div>
          <span class="fw-semibold fs-sm">Acme Inc</span>
        </div>
      </mat-toolbar>
      <div class="flex-1">
        <mat-nav-list class="pt-2">
          @for (item of navItems; track item.label) {
            <mat-list-item [class.active]="item.active"
                           (click)="responsive.isMobile() && sidenavOpened.set(false)"
                           onKeyUp="">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
              @if (item.badge) {
                <span matListItemMeta class="badge rounded-pill px-2 py-0 fs-xs fw-semibold">{{ item.badge }}</span>
              }
            </mat-list-item>
          }
        </mat-nav-list>
      </div>

      <div class="border-top pt-2">
        <mat-list-item>
          <div matListItemIcon class="avatar-small rounded-circle w-7 h-7 d-flex align-items-center justify-content-center fs-xs fw-semibold">JD</div>
          <span matListItemTitle>John Doe</span>
        </mat-list-item>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="position-sticky top-0 border-bottom z-1">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Dashboard</span>
      <span class="flex-1"></span>
      <span class="mode-badge fs-xs px-2 py-1 rounded-1">{{ responsive.isMobile() ? 'Mobile' : 'Desktop' }}</span>
    </mat-toolbar>

    <div class="p-4 d-flex flex-column gap-4 flex-1 overflow-y-auto">
      <div class="placeholder-card rounded-2 min-h-48 flex-1">
        <router-outlet></router-outlet>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
