<div class="profile-header d-flex align-items-center justify-content-between mb-4">
  <div class="d-flex align-items-center gap-3">
    <div class="avatar rounded-2">{{ authService.profile().initials }}</div>
    <div>
      <h1 class="m-0 fs-2xl fw-bold">{{ authService.profile().fullName }}</h1>
      <span class="text-muted fs-sm">UUID: {{ authService.profile().userId }}</span>
    </div>
  </div>

  @if (!editing()) {
    <button mat-stroked-button color="primary" (click)="editing.set(true)">
      <mat-icon class="me-1">edit</mat-icon> Editar
    </button>
  } @else {
    <div class="d-flex gap-2">
      <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid || saving()">
        @if (saving()) {
          <mat-icon class="me-1 spinner">progress_activity</mat-icon>
        } @else {
          <mat-icon class="me-1">save</mat-icon>
        }
        Guardar
      </button>
      <button mat-stroked-button (click)="cancel()">Cancelar</button>
    </div>
  }
</div>

<mat-divider></mat-divider>

<div class="mt-4">
  <h3 class="fw-semibold mb-4">Información personal</h3>
  <form [formGroup]="form" class="d-flex flex-column gap-3">
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Nombres</mat-label>
          <input matInput formControlName="firstName">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Apellidos</mat-label>
          <input matInput formControlName="lastName">
          <mat-icon matPrefix>person_outline</mat-icon>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Correo electrónico</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-icon matPrefix>mail</mat-icon>
        </mat-form-field>
      </div>
    </div>
  </form>
</div>

<mat-divider class="my-4"></mat-divider>

<div>
  <h3 class="fw-semibold mb-4">Cuenta</h3>
  <div class="row">
    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Usuario</mat-label>
        <input matInput [value]="authService.profile().username" disabled>
        <mat-icon matPrefix>alternate_email</mat-icon>
      </mat-form-field>
    </div>
    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email verificado</mat-label>
        <input matInput [value]="authService.profile().emailVerified ? 'Sí' : 'No'" disabled>
        <mat-icon matPrefix>verified</mat-icon>
      </mat-form-field>
    </div>
  </div>
</div>
